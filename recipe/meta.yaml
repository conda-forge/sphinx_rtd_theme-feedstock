{% set version = "3.1.0" %}
{% set sha256 = "b44276f2c276e909239a4f6c955aa667aaafeb78597923b1c60babc76db78e4c" %}
{% set name = "sphinx_rtd_theme" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 1

outputs:
  - name: {{ name }}
    build:
      script: python -m pip install . -vv --no-deps --no-build-isolation
      noarch: python

    requirements:
      host:
        - python {{ python_min }}.*
        - pip
        - setuptools
        - sphinx >=6,<10
      run:
        - python >={{ python_min }}
        - sphinx >=6,<10
        - docutils >0.18,<0.23
        - sphinxcontrib-jquery >=4,<5

    test:
      imports:
        - sphinx_rtd_theme
      requires:
        - python {{ python_min }}.*

  - name: sphinx-rtd-theme
    build:
      noarch: generic
    requirements:
      run:
        - {{ pin_subpackage(name, exact=True) }}
    test:
      imports:
        - sphinx_rtd_theme
      requires:
        - python {{ python_min }}.*

about:
  home: https://github.com/readthedocs/sphinx_rtd_theme/
  license: MIT
  license_file: LICENSE
  summary: ReadTheDocs.org theme for Sphinx, 2013 version.

  description: |
    This is a mobile-friendly sphinx theme made for readthedocs.org. It's currently in
    development there and includes some rtd variable checks that can be ignored if you're
    just trying to use it on your project outside of that site.
  dev_url: https://github.com/readthedocs/sphinx_rtd_theme/

extra:
  recipe-maintainers:
    - SylvainCorlay
    - fhoehle
